# Portfólio de Gustavo Agudo: gustavoagudo.twostack.com.br
# Instalar em /etc/nginx/sites-available/gustavoagudo.conf (link em sites-enabled) e rodar `nginx -t`.
# Pré-requisitos (já existem por causa da landing e do SmartPrice):
#   - conf.d/twostack-http.conf (define a zona twostack_req usada abaixo)
#   - snippets/twostack-tls.conf e snippets/cloudflare-realip.conf
# DNS: registro A `gustavoagudo` apontando para a VPS, com proxy da Cloudflare ligado (nuvem laranja).

# HTTP: a Cloudflare já redireciona para HTTPS; isto cobre quem chega direto na origem.
server {
    listen 80;
    listen [::]:80;
    server_name gustavoagudo.twostack.com.br;

    return 301 https://gustavoagudo.twostack.com.br$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name gustavoagudo.twostack.com.br;

    include /etc/nginx/snippets/twostack-tls.conf;
    include /etc/nginx/snippets/cloudflare-realip.conf;

    server_tokens off;

    # Site estático: não recebe formulário, então o corpo da requisição pode ser mínimo.
    client_max_body_size 1k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    keepalive_timeout 30s;
    large_client_header_buffers 4 8k;

    limit_req zone=twostack_req burst=100 nodelay;
    limit_req_status 429;

    # Só leitura.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Varredura de robôs: nada disto existe aqui. 444 fecha a conexão sem resposta.
    location ~* ^/(\.git|\.svn|\.hg|\.env|wp-admin|wp-login\.php|wp-content|wp-includes|xmlrpc\.php|phpmyadmin|pma|cgi-bin|boaform|actuator|server-status|vendor/phpunit) {
        return 444;
    }
    location ~* \.(php|phtml|asp|aspx|jsp|cgi|sql|bak|old|swp|ini|log|env)$ {
        return 444;
    }
    location ~ /\.(?!well-known/) {
        return 444;
    }

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
